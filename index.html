<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTdocs - Real Estate PDF Library & Autofill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

    <!-- Top Navigation Header -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-20">
        <div class="flex items-center gap-4">
            <img src="WR-Truhomes-P31-exterior stacked.png" 
                 alt="Weichert Realtors Truhomes" 
                 class="h-11 w-auto object-contain rounded"
                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-emerald-950/40\'><i data-lucide=\'file-text\' class=\'w-5 h-5\'></i></div><div><h1 class=\'font-bold text-lg leading-tight tracking-wide text-white\'>WTdocs <span class=\'text-xs font-normal px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 ml-2\'>Cloud Sync v3.0</span></h1><p class=\'text-xs text-slate-400\'>Weichert Truhomes • Web Edition</p></div>'; lucide.createIcons();" />
            <div class="h-6 w-px bg-slate-800 hidden sm:block"></div>
            <div class="hidden sm:block">
                <h1 class="font-bold text-sm leading-tight tracking-wide text-white flex items-center">
                    WTdocs 
                    <span class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 ml-2">Cloud Sync v3.0</span>
                </h1>
                <p class="text-[11px] text-slate-400">Mobile & Web Form Overlay Engine</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div id="cloudStatusBadge" class="bg-emerald-950/40 border border-emerald-500/40 font-medium text-xs px-3.5 py-2 rounded-xl flex items-center gap-2 text-emerald-300">
                <i data-lucide="cloud-check" class="w-4 h-4 text-emerald-400"></i>
                <span id="cloudStatusText">Online Template Mode</span>
            </div>

            <button id="btnExportPDF" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-950/30 flex items-center gap-2 transition active:scale-95">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Export PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Sidebar: Form Library -->
        <aside class="w-80 bg-slate-900/90 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-800/80">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Library Forms</span>
                    <span class="text-[10px] font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-800/50 px-2 py-0.5 rounded-full">11 Master Forms</span>
                </div>
                <div class="relative">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-500"></i>
                    <input type="text" id="librarySearchInput" placeholder="Filter documents..." class="w-full bg-slate-950 border border-slate-800 text-xs rounded-lg pl-8 pr-3 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1.5" id="libraryDocList"></div>

            <div class="p-3 border-t border-slate-800/80 bg-slate-950/50 text-[11px] text-slate-500 text-center">
                Fetches original templates over HTTPS
            </div>
        </aside>

        <!-- Center Container: Form Field Editor -->
        <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
            <div class="bg-slate-900/60 border-b border-slate-800 p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0">
                <div class="flex items-start gap-3">
                    <div class="p-2.5 rounded-xl bg-slate-800 text-emerald-400 border border-slate-700/60 mt-0.5">
                        <i data-lucide="file-signature" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-white flex items-center gap-2" id="activeDocTitle">Offer to Purchase</h2>
                        <p class="text-xs text-slate-400 font-normal" id="activeDocDesc">Purchase Agreement & Terms</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btnClearDocFields" title="Wipe all form inputs completely blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs px-3.5 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 transition active:scale-95">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        <span>Clear All Fields</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6">
                <div class="max-w-4xl mx-auto">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                        <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-800">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                                <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
                                Form Inputs
                            </h3>
                            <span class="text-xs text-slate-500" id="fieldCountBadge">0 fields</span>
                        </div>

                        <div id="docFieldsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Export History -->
        <aside class="w-80 bg-slate-900/90 border-l border-slate-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-800">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Export History</span>
                    <span class="text-[10px] font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-800/50 px-2 py-0.5 rounded-full" id="exportHistoryCount">0 / 10</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="space-y-2">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="history" class="w-3.5 h-3.5 text-emerald-400"></i>
                        Recent Downloads
                    </h4>
                    <div id="recentExportsList" class="space-y-1.5">
                        <div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800/60 text-[11px] text-slate-500 text-center italic">
                            No files exported yet in this session.
                        </div>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <!-- Application Engine -->
    <script>
        const pdfLibrary = [
            {
                id: 'doc-01',
                title: 'Offer to Purchase',
                fileName: 'Offer to purchase (2).pdf',
                category: 'Contracts',
                desc: 'Purchase Agreement & Terms',
                fields: [
                    { id: 'date', label: 'Date', type: 'date', page: 0, x: 450, y: 710 },
                    { id: 'purchaser_name', label: 'Purchaser Name(s)', type: 'text', page: 0, x: 180, y: 675 },
                    { id: 'property_address', label: 'Property Address', type: 'text', page: 0, x: 180, y: 645 },
                    { id: 'seller_name', label: 'Seller Name(s)', type: 'text', page: 0, x: 180, y: 615 },
                    { id: 'purchase_price', label: 'Purchase Price ($)', type: 'text', page: 0, x: 220, y: 560 },
                    { id: 'initial_deposit', label: 'Initial Deposit / Binder ($)', type: 'text', page: 0, x: 250, y: 530 },
                    { id: 'contract_deposit', label: 'Additional Deposit ($)', type: 'text', page: 0, x: 270, y: 500 },
                    { id: 'balance_closing', label: 'Balance at Closing ($)', type: 'text', page: 0, x: 220, y: 470 },
                    { id: 'closing_date', label: 'Target Closing Date', type: 'date', page: 0, x: 200, y: 420 },
                    { id: 'buyer_attorney', label: "Buyer's Attorney Info", type: 'text', page: 0, x: 180, y: 350 },
                    { id: 'seller_attorney', label: "Seller's Attorney Info", type: 'text', page: 0, x: 180, y: 310 }
                ]
            },
            {
                id: 'doc-02',
                title: 'Residential Input Form',
                fileName: 'Residential_Input_Form.pdf',
                category: 'MLS Forms',
                desc: 'SIMLS Residential Listing Input',
                fields: [
                    { id: 'property_type', label: 'Property Type', type: 'text', page: 0, x: 150, y: 720 },
                    { id: 'listing_member', label: 'Listing Member', type: 'text', page: 0, x: 150, y: 695 },
                    { id: 'street_no', label: 'Street No.', type: 'text', page: 0, x: 150, y: 645 },
                    { id: 'street_name', label: 'Street Name', type: 'text', page: 0, x: 150, y: 620 },
                    { id: 'list_price', label: 'List Price ($)', type: 'text', page: 0, x: 380, y: 420 },
                    { id: 'owner_name', label: 'Owner Name', type: 'text', page: 1, x: 150, y: 720 }
                ]
            },
            {
                id: 'doc-03',
                title: 'MultiFamily Input Form',
                fileName: 'MultiFamily_Input_Form.pdf',
                category: 'MLS Forms',
                desc: 'SIMLS Multi-Family Input',
                fields: [
                    { id: 'property_type', label: 'Property Type', type: 'text', page: 0, x: 150, y: 720 },
                    { id: 'listing_member', label: 'Listing Member', type: 'text', page: 0, x: 150, y: 695 },
                    { id: 'street_no', label: 'Street No.', type: 'text', page: 0, x: 150, y: 645 },
                    { id: 'list_price', label: 'List Price ($)', type: 'text', page: 0, x: 380, y: 420 }
                ]
            },
            {
                id: 'doc-04',
                title: 'Property Owner Info',
                fileName: 'Property_Owner_Info.pdf',
                category: 'Disclosures',
                desc: 'SIMLS Owner Contact Form',
                fields: [
                    { id: 'owner_name_primary', label: 'Property Owner Name', type: 'text', page: 0, x: 200, y: 700 },
                    { id: 'primary_contact_phone', label: 'Contact Phone', type: 'text', page: 0, x: 200, y: 660 },
                    { id: 'primary_email', label: 'E-Mail Address', type: 'text', page: 0, x: 200, y: 620 }
                ]
            },
            {
                id: 'doc-05',
                title: 'Weichert Listing Form',
                fileName: 'Weichert_Listing_Form.pdf',
                category: 'Internal',
                desc: 'Weichert Truhomes Listing Form',
                fields: [
                    { id: 'agent_name', label: 'Agent Name', type: 'text', page: 0, x: 180, y: 700 },
                    { id: 'sellers_name', label: "Seller's Name", type: 'text', page: 0, x: 180, y: 650 },
                    { id: 'price', label: 'Listing Price ($)', type: 'text', page: 0, x: 180, y: 600 }
                ]
            },
            {
                id: 'doc-06',
                title: 'Listing Agreement',
                fileName: 'Listing_Agreement.pdf',
                category: 'Contracts',
                desc: 'SIMLS Listing Agreement',
                fields: [
                    { id: 'owner_names', label: 'Owner Name(s)', type: 'text', page: 0, x: 180, y: 700 },
                    { id: 'property_location', label: 'Property Location', type: 'text', page: 0, x: 180, y: 660 }
                ]
            },
            {
                id: 'doc-07',
                title: 'Lead Paint Disclosure',
                fileName: 'Lead_Paint_Disclosure.pdf',
                category: 'Disclosures',
                desc: 'Lead-Based Paint Disclosure',
                fields: [
                    { id: 'seller_1', label: 'Seller Name', type: 'text', page: 0, x: 150, y: 200 },
                    { id: 'purchaser_1', label: 'Purchaser Name', type: 'text', page: 0, x: 150, y: 160 }
                ]
            },
            {
                id: 'doc-08',
                title: 'NYS Anti-Discrimination',
                fileName: 'NYS_Anti_Discrimination.pdf',
                category: 'Disclosures',
                desc: 'NYS Housing Disclosure',
                fields: [
                    { id: 'provided_by', label: 'Form Provided By', type: 'text', page: 0, x: 200, y: 600 },
                    { id: 'client_names', label: 'Client / Consumer Name(s)', type: 'text', page: 0, x: 200, y: 550 }
                ]
            },
            {
                id: 'doc-09',
                title: 'NYS Agency Disclosure',
                fileName: 'NYS_Agency_Disclosure.pdf',
                category: 'Disclosures',
                desc: 'NYS Agency Disclosure (DOS-1736-f)',
                fields: [
                    { id: 'licensee_name', label: 'Licensee Name', type: 'text', page: 0, x: 200, y: 650 },
                    { id: 'brokerage_name', label: 'Company / Brokerage Name', type: 'text', page: 0, x: 200, y: 610 }
                ]
            },
            {
                id: 'doc-10',
                title: 'Cooperating Broker Addendum',
                fileName: 'Cooperating_Broker_Addendum.pdf',
                category: 'Addendums',
                desc: 'Listing Agreement Addendum',
                fields: [
                    { id: 'property_address', label: 'Property Address', type: 'text', page: 0, x: 180, y: 680 },
                    { id: 'coop_commission', label: 'Co-op Commission (%)', type: 'text', page: 0, x: 220, y: 640 }
                ]
            },
            {
                id: 'doc-11',
                title: 'Coming Soon Addendum',
                fileName: 'Coming_Soon_Addendum.pdf',
                category: 'Addendums',
                desc: 'SIMLS Coming Soon Addendum',
                fields: [
                    { id: 'property_address', label: 'Property Address', type: 'text', page: 0, x: 180, y: 700 },
                    { id: 'listing_broker', label: 'Listing Broker', type: 'text', page: 0, x: 180, y: 660 }
                ]
            }
        ];

        let activeDocIndex = 0;
        let exportedPdfHistory = [];

        async function exportFilledPDF() {
            const doc = pdfLibrary[activeDocIndex];
            if (!doc) return;

            const exportBtn = document.getElementById('btnExportPDF');
            const originalBtnContent = exportBtn.innerHTML;
            exportBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Fetching & Filling...`;
            lucide.createIcons();

            try {
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                let pdfDoc;

                // Try fetching the original template file from web server
                try {
                    const response = await fetch(`./${doc.fileName}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const existingBytes = await response.arrayBuffer();
                    pdfDoc = await PDFDocument.load(existingBytes);
                } catch (fetchErr) {
                    console.warn(`Template ${doc.fileName} not found on server. Generating layout page.`);
                    pdfDoc = await PDFDocument.create();
                    pdfDoc.addPage([612, 792]);
                }

                const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
                const pages = pdfDoc.getPages();

                // Try AcroForm filling first
                let filledForm = false;
                try {
                    const form = pdfDoc.getForm();
                    if (form) {
                        doc.fields.forEach(field => {
                            const input = document.getElementById(`field_${field.id}`);
                            const val = input?.value || '';
                            if (val) {
                                try {
                                    const tf = form.getTextField(field.id);
                                    if (tf) {
                                        tf.setText(val);
                                        filledForm = true;
                                    }
                                } catch (e) {}
                            }
                        });
                        if (filledForm) form.flatten();
                    }
                } catch (e) {}

                // Overlay coordinates if form fields aren't flattened/native
                if (!filledForm) {
                    doc.fields.forEach(field => {
                        const input = document.getElementById(`field_${field.id}`);
                        const val = input?.value || '';
                        if (val) {
                            const pageIndex = field.page && field.page < pages.length ? field.page : 0;
                            const targetPage = pages[pageIndex];
                            
                            targetPage.drawText(val, {
                                x: field.x || 150,
                                y: field.y || 500,
                                size: 10,
                                font: fontBold,
                                color: rgb(0, 0, 0.7) // Dark Blue text stamp
                            });
                        }
                    });
                }

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const downloadUrl = URL.createObjectURL(blob);
                const filename = `${doc.title.replace(/[^a-zA-Z0-9]/g, '_')}_Completed.pdf`;
                
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Add to history
                const now = new Date();
                exportedPdfHistory.unshift({
                    title: doc.title,
                    filename: filename,
                    timestamp: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                if (exportedPdfHistory.length > 10) exportedPdfHistory.pop();
                renderExportHistory();

            } catch (err) {
                console.error('PDF Export Error:', err);
            } finally {
                exportBtn.innerHTML = originalBtnContent;
                lucide.createIcons();
            }
        }

        function renderLibraryList(filterText = '') {
            const listEl = document.getElementById('libraryDocList');
            if (!listEl) return;
            listEl.innerHTML = '';
            const query = filterText.toLowerCase().trim();

            pdfLibrary.forEach((doc, idx) => {
                if (query && !doc.title.toLowerCase().includes(query) && !doc.category.toLowerCase().includes(query)) return;

                const isSelected = idx === activeDocIndex;
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border transition cursor-pointer flex items-center justify-between ${
                    isSelected ? 'bg-emerald-950/40 border-emerald-500/50 text-white shadow-md' : 'bg-slate-950/60 border-slate-800/80 text-slate-300 hover:bg-slate-800/50 hover:border-slate-700'
                }`;

                item.onclick = () => {
                    activeDocIndex = idx;
                    renderLibraryList(filterText);
                    renderActiveDocument();
                };

                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="p-2 rounded-lg ${isSelected ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                        </div>
                        <div class="truncate">
                            <h4 class="text-xs font-semibold truncate ${isSelected ? 'text-emerald-300' : 'text-slate-200'}">${doc.title}</h4>
                            <p class="text-[10px] text-slate-500 truncate">${doc.category}</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 shrink-0 ${isSelected ? 'text-emerald-400' : 'text-slate-600'}"></i>
                `;
                listEl.appendChild(item);
            });
            lucide.createIcons();
        }

        function renderActiveDocument() {
            const doc = pdfLibrary[activeDocIndex];
            if (!doc) return;

            document.getElementById('activeDocTitle').innerText = doc.title;
            document.getElementById('activeDocDesc').innerText = doc.desc;
            document.getElementById('fieldCountBadge').innerText = `${doc.fields.length} inputs`;

            const container = document.getElementById('docFieldsContainer');
            container.innerHTML = '';

            doc.fields.forEach(field => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col gap-1.5';
                wrapper.innerHTML = `
                    <label class="flex items-center justify-between text-[11px] font-semibold text-slate-400">
                        <span>${field.label}</span>
                        <span class="text-[9px] text-slate-600 uppercase font-mono">${field.type}</span>
                    </label>
                    <input type="${field.type === 'number' ? 'number' : field.type === 'date' ? 'date' : 'text'}" 
                           id="field_${field.id}" 
                           placeholder="Type input here..."
                           class="w-full px-3 py-2 text-xs transition border bg-slate-950 border-slate-800 rounded-xl doc-field-input text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500/80">
                `;
                container.appendChild(wrapper);
            });
        }

        function renderExportHistory() {
            const historyList = document.getElementById('recentExportsList');
            const historyCount = document.getElementById('exportHistoryCount');
            if (!historyList) return;

            if (historyCount) historyCount.innerText = `${exportedPdfHistory.length} / 10`;

            if (exportedPdfHistory.length === 0) {
                historyList.innerHTML = `<div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800/60 text-[11px] text-slate-500 text-center italic">No files exported yet in this session.</div>`;
                return;
            }

            historyList.innerHTML = '';
            exportedPdfHistory.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs';
                el.innerHTML = `
                    <div class="truncate">
                        <p class="font-medium text-slate-200 truncate">${item.title}</p>
                        <p class="text-[10px] text-slate-500">${item.timestamp}</p>
                    </div>
                    <span class="text-[10px] text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800/50">Saved</span>
                `;
                historyList.appendChild(el);
            });
        }

        function setupEventListeners() {
            document.getElementById('librarySearchInput')?.addEventListener('input', (e) => renderLibraryList(e.target.value));
            document.getElementById('btnClearDocFields')?.addEventListener('click', () => {
                document.querySelectorAll('.doc-field-input').forEach(input => input.value = '');
            });
            document.getElementById('btnExportPDF')?.addEventListener('click', exportFilledPDF);
        }

        window.onload = function() {
            renderLibraryList();
            renderActiveDocument();
            setupEventListeners();
            lucide.createIcons();
        };
    </script>
</body>
</html>
